name: Publish to PyPI

on:
  push:
    branches: [ main ]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Publish to PyPI
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read # to fetch code (actions/checkout)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            objects.githubusercontent.com:443
            github.com:443
            pypi.org:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: ⬇️ Install build dependencies
        run: |
          python -m pip install -U flit

      - name: 🏗️ Build
        run: python -m flit build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          path: ./dist

  # https://docs.pypi.org/trusted-publishers/using-a-publisher/
  publish-pypi:
    name: ⬆️ Upload release to PyPI
    environment: 'publish'
    if: github.repository_owner == 'torchbox' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write  # Mandatory for trusted publishing

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            - github.com:443
            - api.github.com:443
            - ghcr.io:443
            - pkg-containers.githubusercontent.com:443
            - pypi.org:443
            - upload.pypi.org:443
            - files.pythonhosted.org:443
            - fulcio.sigstore.dev:443
            - rekor.sigstore.dev:443
            - tuf-repo-cdn.sigstore.dev:443

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist

      - name: 🚀 Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
